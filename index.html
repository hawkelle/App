<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cycles">
<meta name="theme-color" content="#141414">
<title>Cycles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f5f8f8; --surface:#ffffff; --surface-2:#e9efef; --ink:#1c1c1c; --muted:#6c7272;
  --rule:#2b2b2b; --line:#d3dada; --cell:rgba(28,28,28,.55);
  --berry:#a9465f; --berry-soft:#f4dfe5; --on-berry:#ffffff;
  --f-heavy:#a9465f; --f-medium:#c26a82; --f-light:#dc9daf; --f-spot:#ecc6d0; --on-heavy:#ffffff;
  --teal:#a8dcd9; --teal-soft:#d8f0ee; --teal-ink:#23706b; --teal-strong:#44a39c;
  --dot-past:rgba(28,28,28,.18); --dot-future:rgba(28,28,28,.32); --track:#dde3e3; --track-past:#bcc6c6; --bubble:#f8e8ec; --cloud:#9ea6ab; --cloud-track:#ffffff; --pinkish:#d77f9c;
  --serif:"Fraunces","Iowan Old Style",Georgia,serif;
  --sans:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#1b1b1b; --surface-2:#252525; --ink:#f1eeed; --muted:#9c9a99;
    --rule:#bdbab9; --line:#343434; --cell:rgba(235,232,231,.62);
    --berry:#e894ab; --berry-soft:#3b232b; --on-berry:#1a1a1a;
    --f-heavy:#eb9fb4; --f-medium:#c77990; --f-light:#915568; --f-spot:#664350; --on-heavy:#1a1a1a;
    --teal:#2f5d5a; --teal-soft:#1f3534; --teal-ink:#8fd3cd; --teal-strong:#4f9d97;
    --dot-past:rgba(240,238,237,.2); --dot-future:rgba(240,238,237,.38); --track:#272727; --track-past:#3b3b3b; --bubble:#3b232b; --cloud:#8d9194; --cloud-track:#d7dadc; --pinkish:#f2a7be;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1b1b1b; --surface-2:#252525; --ink:#f1eeed; --muted:#9c9a99;
  --rule:#bdbab9; --line:#343434; --cell:rgba(235,232,231,.62);
  --berry:#e894ab; --berry-soft:#3b232b; --on-berry:#1a1a1a;
  --f-heavy:#eb9fb4; --f-medium:#c77990; --f-light:#915568; --f-spot:#664350; --on-heavy:#1a1a1a;
  --teal:#2f5d5a; --teal-soft:#1f3534; --teal-ink:#8fd3cd; --teal-strong:#4f9d97;
  --dot-past:rgba(240,238,237,.2); --dot-future:rgba(240,238,237,.38); --track:#272727; --track-past:#3b3b3b; --bubble:#3b232b; --cloud:#8d9194; --cloud-track:#d7dadc; --pinkish:#f2a7be;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}
#views{min-height:100vh}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:88px;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--teal-strong);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:30px 20px 24px}
.top{display:flex;align-items:center;gap:12px}
.top svg{width:38px;height:38px;flex:none}
.top h1{font:700 25px/1.1 var(--serif);letter-spacing:-.01em;margin:0;flex:1}
.top .when{font:500 15px var(--sans);color:var(--ink);opacity:.8;white-space:nowrap}
.view{display:none}
.view.on{display:block}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.lbl{font:600 13px var(--sans);color:var(--muted);margin:0 0 8px}
h2.sect{font:500 21px/1.2 var(--serif);margin:28px 0 12px}

/* ---------- today / ring ---------- */
.ring-wrap{position:relative;width:min(86vw,340px);margin:22px auto 6px;aspect-ratio:1}
.ring-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.ring-wrap circle[data-date]{cursor:pointer}
.ring-center{position:absolute;inset:23%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-center .cdl{font:500 14px var(--sans);color:var(--muted)}
.ring-center .big{font:700 58px/1 var(--serif);letter-spacing:-.03em;margin:2px 0 6px}
.ring-center .st{font:600 16px var(--sans)}
.ring-center .st2{font-size:13px;color:var(--muted);margin-top:4px;max-width:190px}
.ring-center .empty{font:500 20px/1.3 var(--serif);max-width:180px}
.btn{background:var(--berry);color:var(--on-berry);border:0;border-radius:999px;padding:13px 22px;font:600 15px var(--sans);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--cell)}
.btn.small{padding:9px 15px;font-size:14px}
.btn.danger{background:#c0392b;color:#fff}
.btn:disabled{opacity:.4}
.center{text-align:center}
.ringbtns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn.big{padding:17px 40px;font-size:17px;min-width:240px;box-shadow:0 6px 20px color-mix(in srgb,var(--berry) 30%,transparent)}
.ring-wrap{margin-top:14px}
.ring-center .big small{font:600 17px var(--sans);color:var(--muted);letter-spacing:0;margin-right:5px}
.dpo{font:600 13px var(--sans);background:var(--teal-soft);color:var(--teal-ink);border:1px solid var(--teal-strong);border-radius:999px;padding:2px 10px;margin:0 0 6px}
.ring-wrap .hit{cursor:pointer}
#ringBubble{cursor:grab}
.ring-wrap.dragging #ringBubble{cursor:grabbing}
.ring-wrap.dragging .bub{filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.ring-wrap svg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ctools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.cg.cmp>div{height:20px}
.cg.cmp>.lab{font-size:11px;padding:0 4px 0 0}
.cg.cmp>.bbtl,.cg.cmp>.bbtc{height:160px}
.cg.cmp>.dayc{justify-content:flex-start;overflow:visible;font-size:9.5px;color:var(--muted)}
.cg.cmp>.dayc .dn{position:relative;z-index:2;white-space:nowrap}
.cb{display:block;width:calc(100% - 1px);height:11px;border-radius:2px}
.cb.lh-neg,.cb.mu-dry{background:var(--line)}
.cb.lh-low{background:color-mix(in srgb,var(--teal-strong) 35%,transparent)}
.cb.lh-high{background:color-mix(in srgb,var(--teal-strong) 65%,transparent)}
.cb.lh-peak,.cb.mu-eggwhite{background:var(--teal-strong)}
.cb.mu-sticky{background:color-mix(in srgb,var(--teal-strong) 22%,transparent)}
.cb.mu-creamy{background:color-mix(in srgb,var(--teal-strong) 42%,transparent)}
.cb.mu-watery{background:color-mix(in srgb,var(--teal-strong) 70%,transparent)}
.cg.cmp>.tdy{box-shadow:none}
.cg.cmp>.dayc.tdy{box-shadow:inset 0 -2px 0 var(--ink)}
.cdt{width:5px;height:5px;border-radius:50%;background:var(--berry)}
.bbtsvg{cursor:pointer}
.facts{margin-top:26px;border-top:1.5px solid var(--rule)}
.fact{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:baseline}
.fact .k{font:600 13px var(--sans);color:var(--muted)}
.fact .v{font:500 18px/1.25 var(--serif)}
.fact .v small{display:block;font:400 13px/1.4 var(--sans);color:var(--muted);margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font:500 12px var(--sans);border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--surface)}
.linkbtn{background:none;border:0;color:var(--berry);font:600 14px var(--sans);padding:0}

/* ---------- flow icon ---------- */
.fi{width:17px;height:17px;border:1.5px solid var(--cell);border-radius:5px;position:relative;overflow:hidden;display:inline-block;flex:none;vertical-align:middle}
.fi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--fill)*100%);background:var(--fc)}

/* ---------- calendar ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:14px 0 4px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:17px;height:17px;border-radius:5px;display:inline-block}
.sw.fert{background:var(--teal-soft);border:1.5px solid var(--teal-strong)}
.sw.pp{border:1.5px dashed var(--berry)}
.calhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 26px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:10px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:8px 0 8px}
.searchwrap{position:relative}
.searchwrap svg{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.statusbg{position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 26px);background:var(--bg);z-index:15;pointer-events:none}
.wk span{text-align:center;font:600 11px var(--sans);letter-spacing:.12em;color:var(--muted)}
.month{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
.month h3{font:500 21px var(--serif);margin:24px 0 10px}
.month h3 span{color:var(--muted)}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{position:relative;aspect-ratio:1/1.14;border:1px solid var(--cell);border-radius:8px;background:transparent;color:var(--ink);padding:0;overflow:hidden;font:500 12px var(--sans);text-align:left}
.cell.blank{border:1px dashed var(--line);pointer-events:none}
.cell .dn{position:absolute;top:4px;left:6px;z-index:2}
.cell.fut .dn{opacity:.6}
.cell::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--fill,0)*100%);background:var(--fc,transparent);z-index:1}
.cell.fl-heavy .dn{color:var(--on-heavy)}
.cell.fert{background:var(--teal-soft)}
.cell.fert.pred{background:repeating-linear-gradient(135deg,var(--teal-soft) 0 5px,transparent 5px 9px)}
.cell.ovu .egg{position:absolute;right:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--teal-strong);z-index:2}
.cell.ovu.pred .egg{background:transparent;border:1.5px solid var(--teal-strong)}
.cell.pp{border:1.5px dashed var(--berry)}
.cell.pp .dn{color:var(--berry)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell .ic{position:absolute;right:4px;bottom:3px;z-index:2;display:flex;gap:3px;align-items:center;font-size:10px;line-height:1}
.cell .ic .h{color:var(--berry)}
.cell.fl-heavy .ic .h,.cell.fl-medium .ic .h{color:var(--on-heavy)}
.cell .ic .lh{font:700 8px var(--sans);background:var(--teal-strong);color:#fff;border-radius:3px;padding:1px 2px}
.cell .ic .cl{width:14px;height:14px;color:var(--cloud)}
.cell.fl-heavy .ic .cl,.cell.fl-medium .ic .cl{color:var(--on-heavy)}
.cell .ic .d{width:4px;height:4px;border-radius:50%;background:var(--muted)}

/* ---------- chart ---------- */
.cnav{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.cnav .t{flex:1;text-align:center}
.cnav .t b{display:block;font:500 19px var(--serif)}
.cnav .t span{font-size:13px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--cell);background:transparent;color:var(--ink);font-size:18px;display:grid;place-items:center;flex:none}
.iconbtn:disabled{opacity:.3}
.cscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1.5px solid var(--rule);border-bottom:1px solid var(--line)}
.cg{display:grid;width:max-content}
.cg>div{height:30px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-size:11px;position:relative}
.cg>.lab{position:sticky;left:0;z-index:3;background:var(--bg);justify-content:flex-start;font:600 12px var(--sans);color:var(--muted);padding:0 6px 0 2px;border-right:1px solid var(--line)}
.cg>.c{cursor:pointer}
.cg>.pcol{background:color-mix(in srgb,var(--f-medium) 32%,transparent)}
.cg>.pcol.spot{background:color-mix(in srgb,var(--f-medium) 16%,transparent)}
.cg>.ppcol{background:color-mix(in srgb,var(--berry) 10%,transparent)}
.cg>.fcol{background:color-mix(in srgb,var(--teal) 55%,transparent)}
.cg>.fcol.pred{background:color-mix(in srgb,var(--teal) 28%,transparent)}
.cg>.ovc{background:color-mix(in srgb,var(--teal-strong) 75%,transparent)}
.cg>.ovc.pred{background:color-mix(in srgb,var(--teal-strong) 38%,transparent)}
.cg>.ovc .lhc.peak,.cg>.ovc .muc.eggwhite{box-shadow:0 0 0 1.5px var(--bg)}
.ckeyrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:12px}
.ckeyrow span{display:inline-flex;align-items:center;gap:6px}
.ckeyrow i{width:14px;height:14px;border-radius:3px;display:inline-block}
.cg>.fut{opacity:.45}
.cg>.tdy{box-shadow:inset 0 -2px 0 var(--ink)}
.cg>.bbtl,.cg>.bbtc{height:190px;padding:0}
.cg>.bbtl svg{position:absolute;right:0;top:0}
.cg>.datec{height:34px;flex-direction:column;line-height:1.05}
.cg>.lab.datec{flex-direction:row}
.cg .mo{font-size:9px;color:var(--muted)}
.lhc{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--sans)}
.lhc.neg{border:1px solid var(--cell);color:var(--muted)}
.lhc.low{background:color-mix(in srgb,var(--teal-strong) 30%,transparent)}
.lhc.high{background:color-mix(in srgb,var(--teal-strong) 65%,transparent);color:#fff}
.lhc.peak{background:var(--teal-strong);color:#fff}
.muc{font:700 11px var(--sans);width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.muc.dry{color:var(--muted)}
.muc.sticky{background:color-mix(in srgb,var(--teal-strong) 18%,transparent)}
.muc.creamy{background:color-mix(in srgb,var(--teal-strong) 38%,transparent)}
.muc.watery{background:color-mix(in srgb,var(--teal-strong) 65%,transparent);color:#fff}
.muc.eggwhite{background:var(--teal-strong);color:#fff}
.cx{font:600 11px var(--sans)}
.cx.peak{color:var(--teal-ink)}
.cx small{font-size:8px;opacity:.8}
.hrt{color:var(--berry);font-size:13px}
.hrt.o{-webkit-text-stroke:1px var(--berry);color:transparent}
.dotm{width:6px;height:6px;border-radius:50%;background:var(--berry)}
.dotn{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.ckey{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.6}
.stack{border-top:1.5px solid var(--rule)}
.shead2,.srow{display:grid;grid-template-columns:62px 1fr 44px;gap:10px;align-items:center}
.shead2{height:22px}.sa0{position:relative;height:100%;flex:1}.sa0 em{position:absolute;transform:translateX(-50%);font:700 11px var(--sans);font-style:normal;color:var(--muted);top:4px}
.srow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 0;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.sl{font-size:11.5px;color:var(--muted);line-height:1.25}.sl b{display:block;color:var(--ink);font-size:13px;font-weight:600}
.tst{position:relative;display:flex;align-items:center;height:30px;border:1.5px solid var(--cell);border-radius:15px;padding:0 11% 0 15%;background:var(--surface)}
.tst::before{content:"";position:absolute;left:5%;top:9px;bottom:9px;width:6px;border-left:1.5px solid var(--cell);border-right:1.5px solid var(--cell)}
.tst::after{content:"";position:absolute;right:4%;top:50%;width:6px;height:6px;border-top:1.5px solid var(--cell);border-right:1.5px solid var(--cell);transform:translateY(-50%) rotate(45deg)}
.tst.ghost{border-color:transparent;background:none;height:20px}.tst.ghost::before,.tst.ghost::after{display:none}
.sa{position:relative;flex:1;height:14px;overflow:hidden;border-radius:3px;background:var(--surface-2);box-shadow:0 0 0 1px var(--line)}
.sa img{position:absolute;top:50%;transform:translateY(-50%);height:auto;max-width:none}
.sa .g{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.25}
.sph img{display:block;width:100%;height:auto;max-height:64px;object-fit:contain;border-radius:4px}
.sr{font:600 13px var(--sans);text-align:right}.sr.lh-high,.sr.lh-peak{color:var(--teal-strong)}
.strips{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px}
.strips figure{margin:0;flex:none;width:112px}
.strips img{width:112px;height:150px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--surface-2)}
.strips figcaption{font-size:12px;margin-top:5px;line-height:1.3}
.strips figcaption b{font-weight:600}

/* ---------- insights ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:4px}
.stat{padding:14px 0;border-bottom:1px solid var(--line)}
.stat:nth-child(odd){padding-right:12px}
.stat b{display:block;font:500 30px/1.1 var(--serif);letter-spacing:-.01em}
.stat span{font-size:13px;color:var(--muted)}
.hist{border-top:1.5px solid var(--rule)}
.yr{border-bottom:1px solid var(--line)}
.yr>summary{list-style:none;display:flex;align-items:baseline;gap:12px;padding:14px 0;cursor:pointer}
.yr>summary::-webkit-details-marker{display:none}
.yr>summary .y{font:500 22px var(--serif)}
.yr>summary .ym{flex:1;font-size:13px;color:var(--muted)}
.yr>summary svg{align-self:center;color:var(--muted);transition:transform .2s}
.yr[open]>summary svg{transform:rotate(180deg)}
.yr .hrow:last-child{border-bottom:0}
.yr[open]{padding-bottom:6px}
.hrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hmain{display:grid;grid-template-columns:1fr auto;gap:7px 10px;background:none;border:0;padding:0;color:var(--ink);text-align:left;font:inherit;width:100%}
.hx{border:1px solid var(--teal-strong);background:var(--teal-soft);color:var(--ink);border-radius:999px;padding:6px 11px;font:500 12.5px var(--sans);white-space:nowrap}
.hrow.ex .hmain{opacity:.4}
.hrow.ex .hx{background:transparent;border-color:var(--cell);color:var(--muted)}
.hrow .n{font:500 16px var(--serif)}
.bar{grid-column:1/-1;height:12px;position:relative;border-radius:6px;background:var(--surface-2)}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px}
.bar .p{background:var(--f-medium)}
.bar .f{background:var(--teal)}
.bar .o{width:4px;background:var(--teal-strong);border-radius:2px}
.setrow{padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:first-of-type{border-top:1.5px solid var(--rule)}
.setrow .lbl{color:var(--ink);font-size:15px;font-weight:500}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--cell);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);padding:8px 13px;border-radius:999px;font:500 14px var(--sans)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.numrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.numrow input{width:84px}
.datarow{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.fine{font-size:13px;color:var(--muted);line-height:1.55;margin-top:24px}

/* ---------- inputs & chips ---------- */
.field{background:var(--surface);border:1px solid var(--cell);border-radius:10px;color:var(--ink);font:500 17px var(--sans);padding:10px 12px;width:100%;-webkit-appearance:none;appearance:none}
textarea.field{resize:vertical;font-size:16px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--cell);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14.5px var(--sans);display:inline-flex;align-items:center;gap:7px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.b[aria-pressed="true"]{background:var(--berry-soft);color:var(--ink);border-color:var(--berry)}
.chip.t[aria-pressed="true"]{background:var(--teal-soft);color:var(--ink);border-color:var(--teal-strong)}

/* ---------- log sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-top:calc(env(safe-area-inset-top,0px) + 10px);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.shead{display:flex;align-items:center;gap:12px;padding:16px 18px 6px;max-width:600px;width:100%;margin:0 auto}
.shead .t{text-align:left!important}
.strip{display:flex;justify-content:space-between;align-items:center;max-width:600px;width:100%;margin:0 auto;padding:8px 14px 12px;border-bottom:1.5px solid var(--rule);touch-action:pan-y}
.sdw{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink);width:48px}
.wd{font:600 11px var(--sans);color:var(--muted)}
.sd{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--sans);border:1.5px solid var(--cell);transition:width .15s,height .15s}
.sd.sel{width:48px;height:48px;font-size:18px;border-width:2px;background:var(--surface-2)}
.sd.fl{background:var(--fc);border-color:var(--fc)}
.sd.fl-heavy,.sd.fl-medium{color:var(--on-heavy)}
.sd.f{background:var(--teal-soft);border-color:var(--teal-strong)}
.sd.fp{border:1.5px dashed var(--teal-strong)}
.sd.ov{background:var(--teal-strong);border-color:var(--teal-strong);color:#fff}
.sd.ovp{border:2px dashed var(--teal-strong)}
.sd.pp{border:1.5px dashed var(--berry);color:var(--berry)}
.tdot{width:5px;height:5px;border-radius:50%;background:transparent}
.tdot.on{background:var(--berry)}
.shead .t{flex:1;text-align:center;min-width:0}
.shead .t b{display:block;font:500 18px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .t span{font-size:13px;color:var(--muted)}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px calc(48px + env(safe-area-inset-bottom,0px))}
.sbody .inner{max-width:560px;margin:0 auto}
.sec{border-bottom:1px solid var(--line)}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px 0;cursor:pointer}
.sec>summary::-webkit-details-marker{display:none}
.sec h4{font:500 18px var(--serif);margin:0;flex:none;display:flex;align-items:center;gap:8px}
.secic{width:22px;height:22px}
.ico{display:inline-block;width:16px;height:16px;flex:none;vertical-align:middle}
.cp{color:var(--berry)}.cf{color:var(--teal-strong)}.ci{color:var(--pinkish)}.cb{color:var(--cloud)}
.tags .tag{display:inline-flex;align-items:center;gap:5px}
.chip .ico{width:16px;height:16px;margin-left:-3px}
.chip[aria-pressed="true"] .ico{color:inherit}
.cell .ic .ico{width:11px;height:11px}
.cell .egg2{position:absolute;right:4px;top:4px;width:12px;height:12px;z-index:2;color:var(--teal-strong)}
.cell.ovu.pred .egg2{opacity:.6}
.cell .bigic{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:2px;z-index:2}
.cell .bigic .ico{width:19px;height:19px}
.cell.fl-heavy .bigic .cp,.cell.fl-medium .bigic .cp{color:var(--on-heavy)}
.legend .ico{width:17px;height:17px}
.ico.secic{width:20px;height:20px}
.tcl{width:16px;height:16px;color:var(--cloud);margin:-3px 4px -3px -2px;vertical-align:middle}
.calfilter{padding-top:4px}
.calfilter .search{font-size:16px;padding:9px 14px 9px 38px;border-radius:999px}
.fchips{flex-wrap:nowrap;overflow-x:auto;margin:8px -20px 0;padding:0 20px 2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips .chip{flex:none;min-height:34px;padding:6px 12px;font-size:13.5px}
.fchips.opts{margin-top:6px}
.fchips.opts[hidden]{display:none}
.fchips .optchip{min-height:30px;padding:4px 11px;font-size:13px;border-style:dashed}
.fchips .optchip[aria-pressed="true"]{border-style:solid}
.calcount{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:6px}
.calcount:empty{display:none}
.cell.dim{opacity:.18}
.cell.hitd{box-shadow:0 0 0 2px var(--teal-strong)}
.mcard.half{max-height:62%}
.tags.pk{margin-top:14px}
.tags.pk .tag{font-size:13.5px;padding:5px 11px;display:inline-flex;align-items:center}
.tag.b{background:var(--berry-soft);border-color:var(--berry)}
.tagbtn{font:inherit;color:var(--ink);cursor:pointer}
.tagbtn:active{transform:scale(.96)}
.tag.t{background:var(--teal-soft);border-color:var(--teal-strong)}
.tag.o{background:transparent;border-style:dashed}
.pknote{white-space:pre-wrap;margin:14px 0 0;font-size:15px;line-height:1.5;border-left:3px solid var(--line);padding-left:12px}
.sec .sv{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec>summary>svg{flex:none;color:var(--muted);transition:transform .2s}
.sec[open]>summary>svg{transform:rotate(180deg)}
.sec[open] .sv{visibility:hidden}
.secb{padding:0 0 18px}
.secb>.sub:first-child{margin-top:0}
.sub{font-size:13px;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.bbtrow{display:flex;gap:10px;align-items:center}
.bbtrow .unit{font:500 17px var(--sans);color:var(--muted)}
.bbtrow .field{max-width:130px}
.bbtrow .field[type=time]{max-width:130px}
.lhrow{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.lhfull{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;background:var(--surface-2)}
.lhfull img{display:block;width:100%;height:auto;max-height:120px;object-fit:cover}
.lhfull .mk{position:absolute;top:0;transform:translateX(-50%);font:700 10px var(--sans);font-style:normal;color:#fff;padding:1px 5px 2px;border-radius:0 0 5px 5px}
.lhfull .mk.c{background:#e0708f}.lhfull .mk.t{background:#3faea6}
.lhthumb{width:56px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.ratio{font:500 15px var(--sans)}
.addrow{display:flex;gap:8px;margin-top:10px}
.done{font:600 15px var(--sans);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 16px}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.mcard{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.mcard.small{border-radius:20px;margin:auto 16px;padding-bottom:20px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mhead h4{font:500 21px var(--serif);margin:0}
.stage{margin:14px 0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
.stage{display:flex;justify-content:center;background:#111}
.stage canvas{display:block;touch-action:none}
.mcard.full{max-height:100%;height:100%;border-radius:0;padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
.rotrow{display:flex;align-items:center;gap:10px;margin:12px 0 2px}
.rotrow input{flex:1;accent-color:var(--berry);height:30px}
.rotrow .iconbtn{width:34px;height:34px;font-size:16px}
#rotVal{font:600 13px var(--sans);min-width:44px;text-align:right;color:var(--muted)}
#tapBtns{margin-top:10px}
#cropBtns .rowend{justify-content:center}
#cropOk{flex-basis:100%;padding:14px;font-size:16px}
#cropBtns[hidden],#tapBtns[hidden],#scanPick[hidden]{display:none}
.scanres{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:6px 0 14px}
.scanres b{font:700 36px/1 var(--serif)}
.warn{color:var(--berry);font-size:14px}
.rowend{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar .in{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;background:none;border:0;color:var(--muted);font:500 11.5px var(--sans);padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font:500 14px var(--sans);z-index:80;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.sheet,.toast{transition:none}}
</style>

<script>
'use strict';
/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const _k2n=new Map(),_n2k=new Map();
const kNum=k=>{let n=_k2n.get(k);if(n===undefined){const[y,m,d]=k.split('-').map(Number);n=Math.round(Date.UTC(y,m-1,d)/864e5);_k2n.set(k,n)}return n};
const nKey=n=>{let k=_n2k.get(n);if(k===undefined){const d=new Date(n*864e5);k=`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;_n2k.set(n,k)}return k};
const addDays=(k,n)=>nKey(kNum(k)+n);
const diffDays=(a,b)=>kNum(b)-kNum(a);
const todayKey=()=>keyOf(new Date());

function detectOvulation(c){
  const temps=[];let lhI=null;
  for(let i=0;i<c.days;i++){const d=state.days[addDays(c.start,i)];if(!d)continue;
    if(typeof d.bbt==='number'&&!(d.bbtFlags&&d.bbtFlags.length))temps.push({i,t:d.bbt});
    if(d.lh==='peak'&&lhI==null)lhI=i}

  for(let j=6;j<=temps.length-3;j++){
    const cov=Math.max(...temps.slice(j-6,j).map(x=>x.t));
    const a=temps[j],b=temps[j+1],e=temps[j+2],f=temps[j+3];
    if(a.t>cov&&b.t>cov&&e.t>cov&&(e.t>=cov+0.2-1e-9||(f&&f.t>cov))){
      if(a.i<1)continue;
      c.ovu={cd:a.i,date:addDays(c.start,a.i-1),basis:'bbt',cover:cov+0.05};return}
  }

  const done=cycles.filter(c=>c.complete&&!c.excluded&&c.len>=15&&c.len<=120);

    ${det?`<p class="ckey">${ovTxt} Hollow temperatures are flagged (poor sleep, alcohol…) and left out of detection. The teal line is your LH ratio from scanned strips; hollow diamonds are tests logged without a scan (L faint, H high, P peak). Mucus: D dry, S sticky, C creamy, W watery, E egg white. Cervix: ↑ high, ↓ low, S soft, F firm, ○ open, • closed. Tap any column to edit that day.</p>`:`<p class="ckey">${ovTxt} Temperatures in °${u}. Tap anywhere on the chart to open that day.</p>`}
    <div id="stripWrap"></div>`;

async function loadStrips(c,N){const items=[];for(let i=0;i<N;i++){const k=addDays(c.start,i),d=state.days[k];if(d&&d.lhPhoto)items.push({k,i,d})}
  if(!items.length)return;const rows=[],figs=[],TP=30,CP=74;
  for(const it of items){const src=await DB.get(it.d.lhPhoto);if(!src)continue;const d=it.d;
    if(d.lhCrop&&d.lhC!=null&&d.lhT!=null){let cc=d.lhC,tt=d.lhT,flip=false;if(cc<tt){cc=1-cc;tt=1-tt;flip=true}
      const gap=cc-tt;let style;if(gap>.04){const dw=(CP-TP)/gap;style=`width:${dw.toFixed(2)}%;left:${(TP-tt*dw).toFixed(2)}%`}else style='width:100%;left:0';
      rows.push(`<button type="button" class="srow" data-date="${it.k}"><span class="sl"><b>CD ${it.i+1}</b>${short(it.k)}</span><span class="sph"><img src="${src}" alt="LH strip ${short(it.k)}"${flip?' style="transform:rotate(180deg)"':''}></span><span class="sr lh-${d.lh||'neg'}">${d.lhRatio!=null?d.lhRatio.toFixed(2):(d.lh?LABEL.lh[d.lh]:'')}</span></button>`)}
    else figs.push(`<figure data-date="${it.k}"><img src="${src}" alt="LH strip ${short(it.k)}"><figcaption><b>Day ${it.i+1}</b>, ${short(it.k)}<br>${d.lhRatio!=null?'T/C '+d.lhRatio.toFixed(2):''} ${d.lh?LABEL.lh[d.lh]:''}</figcaption></figure>`)}
  const w=$('#stripWrap');if(!w||(!rows.length&&!figs.length))return;
  w.innerHTML=`<h2 class="sect">LH strips</h2>${rows.length?`<div class="stack">${rows.join('')}</div>`:''}${figs.length?`<div class="strips">${figs.join('')}</div>`:''}`}

const isOn=(f,v)=>{const x=dayData(logDate)[f];return Array.isArray(x)?x.includes(v):x===v};
const chip=(f,v,label,mode,cls='')=>`<button type="button" class="chip ${cls}" data-f="${f}" data-v="${esc(v)}" data-m="${mode}" aria-pressed="${isOn(f,v)}">${label}</button>`;

function sheetHead(){const k=logDate,t=todayKey();$('#sDate').textContent=fmt(k,{weekday:'long',day:'numeric',month:'long'});
  const cf=cycleFor(k);const bits=[];if(k===t)bits.push('Today');if(cf&&(!cf.c.next||k<cf.c.next))bits.push('Cycle day '+(diffDays(cf.c.start,k)+1));const dp=dpoOf(k);if(dp)bits.push(dp+' DPO');$('#sSub').textContent=bits.join(', ')}
const SEC_KEYS={};{let cur=null;for(const s of SECTIONS){if(s.title){cur=s.title;SEC_KEYS[cur]=[]}SEC_KEYS[cur].push(s.key);if(s.type==='bbt')SEC_KEYS[cur].push('bbtFlags')}}
const SUBLBL={};SECTIONS.forEach(s=>{if(s.label)SUBLBL[s.key]=s.label});
function secSummary(title){const d=dayData(logDate),keys=SEC_KEYS[title],multi=keys.length>1,out=[];
  for(const k of keys){const v=d[k];if(v==null)continue;
    if(k==='bbt')out.push(toUnit(v).toFixed(2)+'°'+state.settings.unit);
    else if(k==='bbtFlags')out.push('flagged');
    else if(k==='note')out.push(v.length>28?v.slice(0,28)+'…':v);
    else if(k==='meds')out.push(...v);
    else if(k==='lh')out.push('LH '+LABEL.lh[v].toLowerCase());
    else if(k==='preg')out.push('Pregnancy '+LABEL.preg[v].toLowerCase());
    else if(k==='pms')out.push('PMS '+LABEL.pms[v].toLowerCase());
    else if(Array.isArray(v))out.push(...v.map(x=>LABEL[k]?.[x]||x));
    else{const l=LABEL[k]?.[v]||v;out.push(multi&&SUBLBL[k]&&k!=='mucus'?`${SUBLBL[k]} ${l.toLowerCase()}`:l)}}
  return out.join(', ')}

function exportCSV(year){const u=state.settings.unit,lab=(f,v)=>v==null?'':(LABEL[f]?.[v]??v),arr=(f,v)=>(v||[]).map(x=>LABEL[f]?.[x]??x).join('; ');

      arr('sex',d.sex),lab('libido',d.libido),arr('pain',d.pain),arr('mood',d.mood),lab('pms',d.pms),lab('energy',d.energy),lab('sleep',d.sleep),arr('digestion',d.digestion),arr('skin',d.skin),arr('cravings',d.cravings),(d.meds||[]).join('; '),d.note||'']});
  const q=v=>{v=String(v);return/[",\n\r;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv='\ufeff'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
